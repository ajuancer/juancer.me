baseURL = "https://juancer.me/"
languageCode = "en-us"
title = "Juan Cerdeño"
copyright = "(c) Juan Cerdeño 2025"
theme = "simple"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    # Based on https://swapoff.org/chroma/playground/
    style = "xcode"
    codeFences = true
    guessSyntax = true
    lineNos = true

[build]
  [build.buildStats]
    enable = true


